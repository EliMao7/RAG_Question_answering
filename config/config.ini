; ============================================================================
; 教师智能问答系统 — 配置文件
; 对应技术设计文档第 2.2 节（数据库设计）与第 11.1 节（配置项说明）
;
; ⚠️ 本文件**只放非敏感配置**，密码与密钥一律不写在这里：
;   - 敏感值放项目根目录的 .env（已被 .gitignore 排除），
;     或在部署环境注入同名环境变量；
;   - 覆盖规则：EDU_{SECTION}_{OPTION}，全大写，例如
;       EDU_MYSQL_PASSWORD      → 覆盖 [mysql].password
;       EDU_MILVUS_HOST         → 覆盖 [milvus].host
;   - LLM 密钥只从环境变量 DASHSCOPE_API_KEY 读取。
;   若 .env 与环境变量同时存在，以真实环境变量为准（override=False）。
; ============================================================================

# MySQL 配置
[mysql]
host = localhost
port = 3306
user = edu_rag
; 密码请放在 .env 的 EDU_MYSQL_PASSWORD 中，不要提交到仓库
password =
database = subjects_kg

# Redis 配置
; password 留空表示不鉴权。
; 若你的 Redis 设了密码，请填在 .env 的 EDU_REDIS_PASSWORD 中。
[redis]
host = localhost
port = 6379
password =
db = 0

# Milvus 配置
[milvus]
host = localhost
port = 19530
database_name = itcast
collection_name = edurag_gz09

# LLM 配置（通义千问）
[llm]
model = qwen3.6-plus
dashscope_base_url = https://dashscope.aliyuncs.com/compatible-mode/v1
; 生成参数（技术文档 5.2.2）
temperature = 0.7
top_p = 0.9
max_tokens = 2048
; 思考模式开关（三态）：
;   false   → 关闭思考，首字延迟约 0.85s（实测），满足技术文档「首字 < 1s」
;   true    → 开启思考，答案质量更高，但首个正文分片约 8s 才出现
;   留空    → 不传该参数，由服务端默认行为决定（思考模型默认开启）
; 问答场景需要打字机效果，故默认关闭。
enable_thinking = false

# Embedding 配置
; dimensions 必须与 Milvus collection 的向量维度一致（技术文档 2.2.2 定义 dim=1536）。
; 两点务必确认：
;   1) 所选模型是否支持 dimensions 指定的维度 —— 不同模型支持的维度区间不同，
;      例如 text-embedding-v3 最高只到 1024 维。若上游拒绝 1536，请改用支持
;      1536 维的模型（如 text-embedding-v4），或把 Milvus 集合维度一并调整；
;   2) 建库与检索必须使用同一个模型 —— 换模型等于换向量空间，
;      旧向量与新查询向量不可比，必须全量重建索引。
; EmbeddingClient 会在首次调用后校验实际返回维度并给出明确报错。
[embedding]
model = text-embedding-v4
dimensions = 1536
; 单次请求最多提交多少条文本。**各模型上限不同**：
;   text-embedding-v1/v2/v3 → 25 条
;   text-embedding-v4       → 10 条
; 填大了会报 "<400> InvalidParameter: batch size is invalid, it should not be
; larger than 10.: input.contents"。换模型时请一并确认此值。
batch_size = 10

# 检索参数配置
[retrieval]
parent_chunk_size = 1200
child_chunk_size = 300
chunk_overlap = 50
retrieval_k = 10
candidate_m = 3
; Milvus IVF_FLAT 检索时探测的聚类簇数（技术文档 5.1.1）
nprobe = 10

# 应用配置
[app]
valid_sources = ["ai", "java", "test", "ops", "bigdata"]
customer_service_phone = 10086
port = 8000

# 日志配置
; 原基因为 macOS 绝对路径，此处改为相对路径以便跨平台/容器运行，
; 实际写入位置 = 项目根目录 / logs/app.log（由 utils/logger.py 拼接）
[logger]
log_file = logs/app.log
log_level = INFO
max_bytes = 10485760
backup_count = 10
